name: JARVIS Test

on:
  workflow_dispatch:

jobs:
  test-jarvis:
    runs-on: ubuntu-latest

    steps:
      - name: Get JARVIS code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OpenAI
        run: pip install -r requirements.txt

      - name: Test JARVIS
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "from openai import OpenAI; client=OpenAI(); response=client.responses.create(model='gpt-5.6-luna', input='Say hello to Mphathi in one short sentence.'); print(response.output_text)"
